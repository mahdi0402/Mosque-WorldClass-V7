services:
  - type: web
    name: mosque-worldclass-v7
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mohanad-barbershop-db
          property: connectionString