<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة مسجد النور</title><style>
@import url("/vendor/cairo/400.css");@import url("/vendor/cairo/600.css");@import url("/vendor/cairo/700.css");@import url("/vendor/cairo/800.css");body,button,input,textarea,select{font-family:"Cairo",Tahoma,Arial,sans-serif!important}
:root{--bg:#060817;--card:#11152b;--line:#282d4c;--purple:#7c3aed;--purple2:#a78bfa;--text:#f7f5ff;--muted:#969bb8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#21104a,transparent 35%),var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial}.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{padding:26px 18px;border-left:1px solid var(--line);background:#080b1bdd}.logo{padding:10px 8px 28px;font-size:22px;font-weight:900}.logo span{color:var(--purple2)}.nav a{display:block;color:var(--muted);text-decoration:none;padding:13px 14px;border-radius:12px;margin:5px 0}.nav a.active,.nav a:hover{background:#7c3aed20;color:#d9c9ff}.main{padding:32px;max-width:1350px;width:100%}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.head h1{margin:0;font-size:32px}.head p{color:var(--muted);margin:6px 0}.status-pill{padding:9px 14px;border-radius:30px;color:#79e6ae;background:#17372d;border:1px solid #2e7058}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:linear-gradient(145deg,#11152be8,#0b0f22e8);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 18px 45px #0004}.card.full{grid-column:1/-1}.card h2{margin:0 0 18px;font-size:19px;color:#ddd3ff}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid var(--line);background:#070a18;color:#fff;border-radius:11px;padding:12px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--purple)}textarea{min-height:92px;resize:vertical}.offsets{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.actions{position:sticky;bottom:0;display:flex;gap:12px;padding:18px 0;background:linear-gradient(transparent,#060817 24%)}button{border:0;border-radius:12px;padding:14px 22px;font-weight:800;cursor:pointer}.save{flex:1;color:#fff;background:linear-gradient(135deg,#6d28d9,#8b5cf6);box-shadow:0 12px 30px #5b21b655}.preview{background:#161a30;color:#ddd;border:1px solid var(--line)}#message{text-align:center;color:#7ff0b4;min-height:22px}@media(max-width:850px){.layout{display:block}.side{display:none}.main{padding:18px}.grid{grid-template-columns:1fr}.card.full{grid-column:auto}.offsets{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><div class="layout"><aside class="side"><div class="logo">☪ مسجد <span>النور</span></div><nav class="nav"><a class="active">⚙ لوحة التحكم</a><a href="/tv-display.html">▣ شاشة التلفزيون</a><a href="/mobile-app.html">▯ تطبيق الهاتف</a></nav></aside><main class="main"><header class="head"><div><h1>مركز التحكم الذكي</h1><p>تحديث مباشر لجميع شاشات المسجد</p></div><span class="status-pill">● النظام متصل</span></header><form id="form"><div class="grid"><section class="card"><h2>معلومات المسجد</h2><div class="fields"><div class="field full"><label>اسم المسجد</label><input id="name"></div><div><label>البلدة</label><input id="city"></div><div><label>المظهر</label><select id="theme"><option value="royal">ليلي ملكي</option><option value="emerald">زمردي</option></select></div><div><label>خط العرض</label><input id="lat" type="number" step=".0001"></div><div><label>خط الطول</label><input id="lng" type="number" step=".0001"></div></div></section><section class="card"><h2>الجمعة وشريط الأخبار</h2><div class="fields"><div><label>صلاة الجمعة</label><input id="jumuah" type="time"></div><div><label>إقامة الجمعة</label><input id="jumuahIqamah" type="time"></div><div class="field full"><label>الإعلان الرئيسي</label><textarea id="announcement"></textarea></div><div class="field full"><label>الإعلان الإضافي</label><textarea id="secondaryAnnouncement"></textarea></div></div></section><section class="card full"><h2>الإقامة بعد الأذان</h2><div class="offsets"><div><label>الفجر</label><input id="Fajr" type="number"></div><div><label>الظهر</label><input id="Dhuhr" type="number"></div><div><label>العصر</label><input id="Asr" type="number"></div><div><label>المغرب</label><input id="Maghrib" type="number"></div><div><label>العشاء</label><input id="Isha" type="number"></div></div></section></div><div id="message"></div><div class="actions"><button type="button" class="preview" onclick="window.open('/tv-display.html','_blank')">معاينة الشاشة</button><button class="save">حفظ وإرسال فورًا</button></div></form></main></div><script>
const ids=["name","city","lat","lng","theme","jumuah","jumuahIqamah","announcement","secondaryAnnouncement"],prayers=["Fajr","Dhuhr","Asr","Maghrib","Isha"],$=id=>document.getElementById(id);
let adminToken=sessionStorage.getItem("mosqueAdminPin")||prompt("أدخل رمز إدارة المسجد:")||"";
async function verifyAndLoad(){const auth=await fetch("/api/admin/verify",{method:"POST",headers:{"x-admin-pin":adminToken}});if(!auth.ok){sessionStorage.removeItem("mosqueAdminPin");document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;text-align:center"><div><h1>تعذر الدخول</h1><p>رمز الإدارة غير صحيح. أعد تحميل الصفحة للمحاولة مجددًا.</p></div></main>';return}sessionStorage.setItem("mosqueAdminPin",adminToken);const s=await fetch("/api/state").then(r=>r.json());ids.forEach(k=>$(k).value=s[k]??"");prayers.forEach(k=>$(k).value=s.iqamahOffsets[k])}
verifyAndLoad();
form.onsubmit=async e=>{e.preventDefault();const body={};ids.forEach(k=>body[k]=$(k).value);body.lat=Number(body.lat);body.lng=Number(body.lng);body.iqamahOffsets=Object.fromEntries(prayers.map(k=>[k,Number($(k).value)]));const r=await fetch("/api/admin/update",{method:"POST",headers:{"Content-Type":"application/json","x-admin-pin":adminToken},body:JSON.stringify(body)});message.textContent=r.ok?"✓ تم الحفظ في قاعدة البيانات وتحديث جميع الشاشات بنجاح":r.status===401?"رمز الإدارة غير صحيح":"تعذر الحفظ";setTimeout(()=>message.textContent="",3500)}
</script></body></html>
