<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b16a8">
  <title>مسجد النور | التطبيق</title>
  <style>
    @import url("/vendor/cairo/400.css");@import url("/vendor/cairo/600.css");@import url("/vendor/cairo/700.css");@import url("/vendor/cairo/800.css");
    :root{--purple:#5b16a8;--purple2:#7b35c8;--soft:#f4eef9;--ink:#24212a;--muted:#7b7682;--line:#ede8f1}
    *{box-sizing:border-box}html{background:#e9e5ed}body{margin:0;font-family:"Cairo",Tahoma,Arial,sans-serif;color:var(--ink);background:#e9e5ed}.hero-count,.adhan,.iqama,.degree{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:.01em}
    button,input{font:inherit}.app{width:100%;max-width:520px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 70px #32144c25;padding-bottom:88px;position:relative;overflow:hidden}.screen{display:none}.screen.active{display:block;animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(5px)}}
    .hero{padding:22px 22px 32px;text-align:center;color:#4d009d;background:radial-gradient(circle at 15% 0,#fff9,transparent 28%),linear-gradient(145deg,#f9f3fc,#dcb8ec 60%,#fff);border-radius:0 0 36px 36px;box-shadow:0 20px 50px #6122881a;position:relative;overflow:hidden}.hero:before{content:"الله أكبر  الحمد لله  سبحان الله";position:absolute;inset:20px -50px;font-size:55px;font-weight:900;opacity:.045;transform:rotate(-10deg)}.topbar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.circle{width:46px;height:46px;border:0;border-radius:50%;background:#671eaa16;color:var(--purple);font-size:20px}.identity strong{display:block;font-size:20px}.identity small{color:#6f438d}.next-label{position:relative;margin-top:32px;font-size:17px}.hero-count{direction:ltr;position:relative;font-size:70px;font-weight:900;line-height:1.05;letter-spacing:-3px}.dates{position:relative;font-size:14px;margin-top:10px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:18px 18px 8px}.quick button{border:0;border-radius:17px;padding:12px 6px;background:#faf8fc;color:var(--purple);font-weight:700}.announcement{margin:10px 18px;padding:12px 14px;border-radius:14px;background:#f7f2fa;color:#5d168f;font-size:13px}.prayer-list{padding:4px 16px 20px}.prayer-row{direction:ltr;display:grid;grid-template-columns:1fr auto;align-items:center;padding:15px 14px;border-radius:19px;margin:3px 0}.prayer-row.active{color:var(--purple);background:linear-gradient(120deg,#f4eef9,#eee5f6);box-shadow:inset 4px 0 var(--purple)}.prayer-info{text-align:left}.prayer-name{color:var(--muted);font-size:17px}.active .prayer-name{color:var(--purple)}.times{display:flex;align-items:baseline;gap:13px}.adhan{font-size:34px;font-weight:600}.active .adhan{font-weight:900}.iqama{font-size:18px}.bell{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--purple);background:#ede6f3}
    .page-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px;background:#fff;border-bottom:1px solid var(--line)}.page-head h1{font-size:23px;margin:0}.page-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.search{margin:16px 18px 8px;width:calc(100% - 36px);border:1px solid var(--line);border-radius:14px;background:#f8f6fa;padding:13px 15px;outline:none}.search:focus{border-color:#a876d5}.surahs{padding:4px 14px}.surah-card{width:100%;border:0;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:14px 8px;text-align:right;cursor:pointer}.surah-num{width:43px;height:43px;display:grid;place-items:center;color:var(--purple);background:var(--soft);border-radius:13px;font-weight:800}.surah-card strong{font-size:17px}.surah-card small{display:block;color:var(--muted);margin-top:3px}.arabic-name{color:var(--purple);font-size:20px}.loader{text-align:center;padding:55px;color:var(--muted)}.reader{display:none}.reader.open{display:block;position:fixed;z-index:20;inset:0;margin:auto;max-width:520px;background:#fff;overflow:auto}.reader-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:15px 17px;background:#fffdfd;border-bottom:1px solid var(--line)}.reader-head button{border:0;background:var(--soft);color:var(--purple);width:42px;height:42px;border-radius:50%}.ayahs{padding:16px 18px 50px;background:#fffdfb}.bismillah{text-align:center;color:var(--purple);font-size:26px;padding:18px}.ayah{font-family:"Traditional Arabic","Amiri",serif;font-size:27px;line-height:2.05;padding:13px 5px;border-bottom:1px solid #f3edf3}.ayah span{display:inline-grid;place-items:center;width:31px;height:31px;margin:0 7px;color:var(--purple);background:#f1e8f6;border-radius:50%;font:14px "Segoe UI"}
    .dua-cats{display:flex;gap:8px;overflow:auto;padding:14px 18px}.dua-cats button{white-space:nowrap;border:0;border-radius:99px;padding:9px 14px;background:#f5f1f7;color:#6e6873}.dua-cats button.active{background:var(--purple);color:#fff}.duas{padding:0 17px}.dua-card{padding:18px;margin:10px 0;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#fff,#fbf8fd);box-shadow:0 12px 30px #4418660a}.dua-title{display:flex;justify-content:space-between;color:var(--purple);font-weight:800}.dua-text{font-family:"Traditional Arabic","Amiri",serif;font-size:24px;line-height:1.8;margin:12px 0}.dua-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.fav{border:0;background:none;color:#a47abf;font-size:22px}.fav.on{color:#d69a22}
    .qibla-wrap{min-height:calc(100vh - 88px);text-align:center;background:radial-gradient(circle at 50% 42%,#eadcf4,transparent 36%),linear-gradient(#faf7fc,#fff);padding:22px}.qibla-wrap h1{margin:6px 0}.qibla-wrap p{color:var(--muted)}.compass{width:min(78vw,360px);aspect-ratio:1;margin:32px auto 18px;border-radius:50%;position:relative;background:conic-gradient(from -2deg,#6d1db4 0 3deg,#f0e6f6 3deg 90deg,#ddd0e8 90deg 91deg,#f0e6f6 91deg 180deg,#ddd0e8 180deg 181deg,#f0e6f6 181deg 270deg,#ddd0e8 270deg 271deg,#f0e6f6 271deg);box-shadow:0 25px 70px #4a176c24,inset 0 0 0 14px #fff,inset 0 0 0 16px #d7c5e3}.compass:after{content:"N";position:absolute;top:20px;left:50%;transform:translateX(-50%);color:#bb274e;font-weight:900}.needle{position:absolute;inset:17%;transition:transform .25s ease}.needle:before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-bottom:130px solid var(--purple);filter:drop-shadow(0 7px 8px #4f176c55)}.needle:after{content:"◆";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:36px;color:#f4bd55}.degree{font-size:42px;color:var(--purple);font-weight:900}.qibla-btn{border:0;border-radius:14px;padding:13px 22px;color:#fff;background:linear-gradient(135deg,#551397,#7b35c8);font-weight:800}.accuracy{margin-top:16px;color:var(--muted);font-size:12px}.notice{margin:20px auto;max-width:400px;padding:13px;border-radius:14px;background:#f6f0fa;color:#631e9b;font-size:13px}
    .qibla-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.qibla-btn.secondary{color:var(--purple);background:#eee5f6}.manual{display:none;max-width:400px;margin:15px auto 0;padding:13px;border-radius:15px;background:#fff;box-shadow:0 8px 25px #4a176c12}.manual.show{display:block}.manual input{width:100%;accent-color:var(--purple)}.notice.error{background:#fff0f0;color:#9a2840}.notice.ok{background:#edf9f2;color:#176b40}
    .bottom-nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(16px)}.nav-btn{border:0;background:transparent;color:#aaa3ad;display:grid;gap:3px;place-items:center;font-size:11px}.nav-btn i{font-style:normal;font-size:22px}.nav-btn.active{color:var(--purple);font-weight:800}.toast{position:fixed;z-index:50;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);opacity:0;background:#24142f;color:#fff;padding:11px 17px;border-radius:12px;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%)}
  </style>
</head>
<body><main class="app">
  <section id="prayerScreen" class="screen active">
    <header class="hero"><div class="topbar"><button class="circle">☾</button><div class="identity"><strong id="mosque">مسجد النور</strong><small id="city">الجديدة - المكر</small></div><button class="circle" onclick="location.href='/admin.html'">⚙</button></div><div id="nextLabel" class="next-label">الصلاة القادمة</div><div id="countdown" class="hero-count">00:00</div><div class="dates"><span id="hijri"></span> | <span id="date"></span></div></header>
    <div class="quick"><button onclick="openTab('quran')">☷ القرآن</button><button onclick="openTab('duas')">♡ الأدعية</button><button onclick="openTab('qibla')">⌁ القبلة</button></div><div id="announcement" class="announcement"></div><section id="prayerList" class="prayer-list"></section>
  </section>
  <section id="quranScreen" class="screen"><header class="page-head"><div><h1>القرآن الكريم</h1><p>اختر سورة لبدء القراءة</p></div><button class="circle" onclick="loadLastRead()">↻</button></header><input id="surahSearch" class="search" placeholder="ابحث عن سورة..." oninput="filterSurahs()"><div id="surahs" class="surahs"><div class="loader">جاري تحميل السور...</div></div></section>
  <section id="duasScreen" class="screen"><header class="page-head"><div><h1>الأدعية والأذكار</h1><p>حصنك اليومي</p></div><button class="circle" onclick="showFavorites()">★</button></header><div id="duaCats" class="dua-cats"></div><div id="duas" class="duas"></div></section>
  <section id="qiblaScreen" class="screen"><div class="qibla-wrap"><h1>اتجاه القبلة</h1><p id="qiblaLocation">الجديدة - المكر</p><div class="compass"><div id="needle" class="needle"></div></div><div><span id="qiblaDegree" class="degree">--°</span><p>من اتجاه الشمال الحقيقي</p></div><div class="qibla-actions"><button id="compassBtn" class="qibla-btn" onclick="enableCompass()">تفعيل بوصلة الهاتف</button><button class="qibla-btn secondary" onclick="useMyLocation()">استخدام موقعي</button></div><div id="manualCompass" class="manual"><label for="manualHeading">الوضع اليدوي: <strong id="manualDegree">0°</strong></label><input id="manualHeading" type="range" min="0" max="359" value="0" oninput="setManualHeading(this.value)"></div><div id="qiblaInfo" class="notice">اضغط تفعيل واسمح بالوصول للحركة والاتجاه، ثم حرّك الهاتف على شكل الرقم 8 للمعايرة.</div><div id="accuracy" class="accuracy"></div></div></section>
  <nav class="bottom-nav"><button class="nav-btn active" data-tab="prayer" onclick="openTab('prayer')"><i>◷</i>الصلاة</button><button class="nav-btn" data-tab="quran" onclick="openTab('quran')"><i>☷</i>القرآن</button><button class="nav-btn" data-tab="duas" onclick="openTab('duas')"><i>♡</i>الأدعية</button><button class="nav-btn" data-tab="qibla" onclick="openTab('qibla')"><i>⌁</i>القبلة</button></nav>
  <section id="reader" class="reader"><header class="reader-head"><button onclick="closeReader()">→</button><div><strong id="readerName"></strong><small id="readerMeta" style="display:block;color:var(--muted)"></small></div></header><div id="ayahs" class="ayahs"></div></section><div id="toast" class="toast"></div>
</main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id), names={Fajr:"الفجر",Dhuhr:"الظهر",Asr:"العصر",Maghrib:"المغرب",Isha:"العشاء"}, prayerKeys=Object.keys(names), pad=n=>String(n).padStart(2,"0"), sec=t=>{const[h,m]=t.split(":").map(Number);return h*3600+m*60};
let state=null,surahData=[],duaFilter="الكل",heading=0,qiblaBearing=0,compassActive=false,lastHeading=null;
function plus(t,min){const x=sec(t)+min*60;return `${pad(Math.floor(x/3600)%24)}:${pad(Math.floor(x%3600/60))}`}
function renderState(s){state=s;$("mosque").textContent=s.name;$("city").textContent=s.city;$("announcement").textContent=s.announcement;calculateQibla(s.lat,s.lng);tick()}
function tick(){if(!state)return;const d=new Date(),now=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();let next=prayerKeys.find(k=>sec(state.timings[k])>now),extra=0;if(!next){next="Fajr";extra=86400}const diff=sec(state.timings[next])+extra-now,hours=Math.floor(diff/3600),minutes=Math.floor(diff%3600/60);$("nextLabel").textContent=`${names[next]} بعد · ساعة : دقيقة`;$("countdown").textContent=`${pad(hours)}:${pad(minutes)}`;$("date").textContent=d.toLocaleDateString("ar-EG",{weekday:"short",day:"numeric",month:"short"});$("hijri").textContent=new Intl.DateTimeFormat("ar-SA-u-ca-islamic",{day:"numeric",month:"long",year:"numeric"}).format(d);$("prayerList").innerHTML=prayerKeys.map(k=>`<article class="prayer-row ${k===next?"active":""}"><div class="prayer-info"><div class="prayer-name">${names[k]}</div><div class="times"><span class="adhan">${state.timings[k]}</span><span class="iqama">${plus(state.timings[k],state.iqamahOffsets[k])}</span></div></div><div class="bell">♧</div></article>`).join("")}
function openTab(tab){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(`${tab}Screen`).classList.add("active");document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));if(tab==="quran"&&!surahData.length)loadSurahs();if(tab==="duas")renderDuas();if(tab==="qibla")checkCompassSupport();window.scrollTo(0,0)}
async function loadSurahs(){try{const r=await fetch("/quran/index.json");if(!r.ok)throw new Error("offline quran unavailable");surahData=await r.json();renderSurahs(surahData)}catch{$("surahs").innerHTML='<div class="loader">تعذر فتح ملفات القرآن المحلية. أعد تشغيل الخادم.</div>'}}
function renderSurahs(list){$("surahs").innerHTML=list.map(s=>`<button class="surah-card" onclick="openSurah(${s.id})"><span class="surah-num">${s.id}</span><span><strong>${s.transliteration}</strong><small>${s.type==="meccan"?"مكية":"مدنية"} · ${s.total_verses} آية</small></span><span class="arabic-name">${s.name}</span></button>`).join("")}
function filterSurahs(){const q=$("surahSearch").value.trim().toLowerCase();renderSurahs(surahData.filter(s=>s.name.includes(q)||s.transliteration.toLowerCase().includes(q)||String(s.id)===q))}
async function openSurah(number){$("reader").classList.add("open");$("ayahs").innerHTML='<div class="loader">جاري فتح السورة...</div>';try{const r=await fetch(`/quran/${number}.json`);if(!r.ok)throw new Error("surah unavailable");const s=await r.json();$("readerName").textContent=s.name;$("readerMeta").textContent=`${s.total_verses} آية · ${s.type==="meccan"?"مكية":"مدنية"}`;$("ayahs").innerHTML=`${number!==1&&number!==9?'<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':""}${s.verses.map(a=>`<div class="ayah">${a.text} <span>${a.id}</span></div>`).join("")}`;localStorage.setItem("lastSurah",number);$("reader").scrollTop=0}catch{$("ayahs").innerHTML='<div class="loader">تعذر فتح السورة من الملفات المحلية.</div>'}}
function closeReader(){$("reader").classList.remove("open")}function loadLastRead(){openSurah(Number(localStorage.getItem("lastSurah")||1))}
const duaItems=[
{c:"الصباح",t:"أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له.",n:"مرة واحدة"},
{c:"المساء",t:"أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له.",n:"مرة واحدة"},
{c:"النوم",t:"باسمك اللهم أموت وأحيا.",n:"مرة واحدة"},
{c:"الاستيقاظ",t:"الحمد لله الذي أحيانا بعدما أماتنا وإليه النشور.",n:"مرة واحدة"},
{c:"الصلاة",t:"اللهم أعني على ذكرك وشكرك وحسن عبادتك.",n:"بعد الصلاة"},
{c:"عام",t:"ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار.",n:"دعاء جامع"},
{c:"عام",t:"لا إله إلا أنت سبحانك إني كنت من الظالمين.",n:"دعاء الكرب"}
];
function renderDuas(){const cats=["الكل",...new Set(duaItems.map(x=>x.c))];$("duaCats").innerHTML=cats.map(c=>`<button class="${c===duaFilter?"active":""}" onclick="setDuaCat('${c}')">${c}</button>`).join("");const favs=JSON.parse(localStorage.getItem("duaFavs")||"[]");$("duas").innerHTML=duaItems.map((d,i)=>({...d,i})).filter(d=>duaFilter==="المفضلة"?favs.includes(d.i):duaFilter==="الكل"||d.c===duaFilter).map(d=>`<article class="dua-card"><div class="dua-title"><span>${d.c}</span><button class="fav ${favs.includes(d.i)?"on":""}" onclick="toggleFav(${d.i})">★</button></div><div class="dua-text">${d.t}</div><div class="dua-meta"><span>${d.n}</span><button class="fav" onclick="copyDua(${d.i})">⧉</button></div></article>`).join("")||'<div class="loader">لا توجد أدعية محفوظة.</div>'}
function setDuaCat(c){duaFilter=c;renderDuas()}function showFavorites(){duaFilter="المفضلة";renderDuas()}function toggleFav(i){let f=JSON.parse(localStorage.getItem("duaFavs")||"[]");f=f.includes(i)?f.filter(x=>x!==i):[...f,i];localStorage.setItem("duaFavs",JSON.stringify(f));renderDuas()}async function copyDua(i){await navigator.clipboard?.writeText(duaItems[i].t);showToast("تم نسخ الدعاء")}
function calculateQibla(lat,lng){const r=Math.PI/180,p1=lat*r,p2=21.4225*r,dl=(39.8262-lng)*r;qiblaBearing=(Math.atan2(Math.sin(dl),Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl))/r+360)%360;$("qiblaDegree").textContent=`${Math.round(qiblaBearing)}°`;$("needle").style.transform=`rotate(${qiblaBearing-heading}deg)`;$("qiblaLocation").textContent=state?.city||"موقعك"}
function setQiblaMessage(text,type=""){$("qiblaInfo").textContent=text;$("qiblaInfo").className=`notice ${type}`}
function checkCompassSupport(){if(!window.isSecureContext&&!["localhost","127.0.0.1"].includes(location.hostname)){setQiblaMessage("البوصلة الحية محجوبة لأن الصفحة مفتوحة عبر HTTP. افتح التطبيق عبر HTTPS لتعمل حساسات iPhone. يمكنك مؤقتًا استعمال الوضع اليدوي.","error");$("manualCompass").classList.add("show");return false}if(typeof DeviceOrientationEvent==="undefined"){setQiblaMessage("هذا الجهاز أو المتصفح لا يوفّر حساس اتجاه. استخدم الوضع اليدوي.","error");$("manualCompass").classList.add("show");return false}return true}
async function enableCompass(){if(!checkCompassSupport())return;try{if(typeof DeviceOrientationEvent.requestPermission==="function"){const permission=await DeviceOrientationEvent.requestPermission();if(permission!=="granted"){setQiblaMessage("لم يتم السماح بحساس الحركة والاتجاه. فعّله من إعدادات Safari ثم حاول مجددًا.","error");return}}window.removeEventListener("deviceorientationabsolute",orientation,true);window.removeEventListener("deviceorientation",orientation,true);window.addEventListener("deviceorientationabsolute",orientation,true);window.addEventListener("deviceorientation",orientation,true);compassActive=true;lastHeading=null;$("compassBtn").textContent="البوصلة مفعّلة";setQiblaMessage("جاري قراءة الحساس… حرّك الهاتف على شكل الرقم 8 للمعايرة.","ok");setTimeout(()=>{if(compassActive&&lastHeading===null){setQiblaMessage("لم تصل قراءة من الحساس. تأكد من السماح بالوصول للحركة والاتجاه، أو استخدم HTTPS.","error");$("manualCompass").classList.add("show")}},2500)}catch(err){setQiblaMessage(`تعذر تشغيل البوصلة: ${err.message||"الإذن غير متاح"}`,"error");$("manualCompass").classList.add("show")}}
function screenAngle(){return screen.orientation?.angle??window.orientation??0}
function orientation(e){let raw=e.webkitCompassHeading;if(typeof raw!=="number"&&typeof e.alpha==="number")raw=(360-e.alpha+screenAngle()+360)%360;if(typeof raw!=="number"||Number.isNaN(raw))return;if(lastHeading===null)heading=raw;else{const delta=((raw-lastHeading+540)%360)-180;heading=(heading+delta*.28+360)%360}lastHeading=raw;$("needle").style.transform=`rotate(${qiblaBearing-heading}deg)`;const accuracy=typeof e.webkitCompassAccuracy==="number"?` · الدقة ±${Math.round(e.webkitCompassAccuracy)}°`:"";$("accuracy").textContent=`اتجاه الهاتف: ${Math.round(heading)}°${accuracy}`;setQiblaMessage("البوصلة فعالة. اجعل الهاتف أفقيًا واتبع السهم البنفسجي نحو القبلة.","ok")}
function setManualHeading(value){heading=Number(value);$("manualDegree").textContent=`${heading}°`;$("needle").style.transform=`rotate(${qiblaBearing-heading}deg)`;$("accuracy").textContent=`الاتجاه اليدوي: ${heading}°`}
function useMyLocation(){if(!navigator.geolocation){setQiblaMessage("خدمة الموقع غير متاحة في هذا المتصفح.","error");return}if(!window.isSecureContext){setQiblaMessage("تحديد الموقع يحتاج HTTPS على الهاتف. ما زالت القبلة محسوبة من موقع المسجد المحفوظ.","error");return}setQiblaMessage("جاري تحديد موقعك…");navigator.geolocation.getCurrentPosition(pos=>{calculateQibla(pos.coords.latitude,pos.coords.longitude);$("qiblaLocation").textContent="موقع الهاتف الحالي";setQiblaMessage("تم حساب القبلة من موقع هاتفك. فعّل البوصلة الآن.","ok")},err=>setQiblaMessage(err.code===1?"لم يتم السماح بالموقع. اسمح به من إعدادات المتصفح.":"تعذر تحديد الموقع، حاول في مكان مفتوح.","error"),{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
function showToast(text){$("toast").textContent=text;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
fetch("/api/state").then(r=>r.json()).then(renderState);io().on("stateUpdate",renderState);setInterval(tick,1000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
